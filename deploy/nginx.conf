# 用法：把 web/ 整个目录拷到服务器，然后
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/pepec900
#   sudo ln -s /etc/nginx/sites-available/pepec900 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pepec900.example.com     # 自动签发并配置 HTTPS
#
# 注意：录音需要麦克风权限，浏览器只允许在 HTTPS 或 localhost 下使用。
# 所以这个站点必须配 HTTPS，不能只开 80 端口。

server {
    listen 80;
    listen [::]:80;
    server_name pepec900.example.com;

    root /var/www/pepec900;
    index index.html;

    # 强制 HTTPS（certbot 会自动补 443 段）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pepec900.example.com;

    root /var/www/pepec900;
    index index.html;

    # ssl_certificate / ssl_certificate_key 由 certbot 写入

    # 压缩：js / css / json / svg 收益最大
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # HTML 不缓存，改版立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 带 ?v= 的静态资源长缓存（版本号变了 URL 就变了）
    location ~* \.(?:js|css|svg|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 音频：900 个文件，量不大但请求多，允许长缓存
    location /audio/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全响应头（麦克风需要 Permissions-Policy 放行 self）
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self)" always;
}
